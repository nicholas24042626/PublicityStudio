services:
  - type: web
    name: publicity-studio
    runtime: python
    buildCommand: echo "No build required"
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SCHEDULE_INTEGRATION_SECRET
        generateValue: true
      - key: POSTER_SIGNING_SECRET
        generateValue: true
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2
